<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henri Barrett® remix george</title>
    <meta name="description" content="Portafolio interactivo de Henri Barrett® con grilla dinámica masonry de Quicklys 9:16 y reproductor embebido de Reels oficiales de @henribarrettstudio." />
    <meta property="og:title" content="Henri Barrett® remix george" />
    <meta property="og:description" content="Portafolio interactivo de Henri Barrett® con grilla dinámica masonry de Quicklys 9:16 y reproductor embebido de Reels oficiales de @henribarrettstudio." />
    
    <!-- ADOBE FONTS (TYPEKIT) -->
    <link rel="stylesheet" href="https://use.typekit.net/hdy5eik.css">
    
    <style>
      body {
        /* Se asume que el kit de Adobe proporciona la familia 'neue-haas-grotesk-display' o similar. 
           Usamos un stack de fuentes compatible. */
        font-family: "neue-haas-grotesk-display", "neue-haas-grotesk-text", 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #000000;
        -webkit-font-smoothing: antialiased;
        color: #000000;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      h1, h2, h3 {
        letter-spacing: -0.04em;
        line-height: 0.95;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes marquee-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes marquee-right {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0); }
      }
      @keyframes marquee-up {
        0% { transform: translateY(0); }
        100% { transform: translateY(-50%); }
      }
      @keyframes marquee-down {
        0% { transform: translateY(-50%); }
        100% { transform: translateY(0); }
      }
      .animate-marquee-left {
        animation: marquee-left 30s linear infinite;
      }
      .animate-marquee-right {
        animation: marquee-right 30s linear infinite;
      }
      .animate-marquee-up {
        animation: marquee-up 32s linear infinite;
      }
      .animate-marquee-down {
        animation: marquee-down 32s linear infinite;
      }
      .animate-marquee-up-alt {
        animation: marquee-up 38s linear infinite;
      }
      .animate-marquee-down-alt {
        animation: marquee-down 36s linear infinite;
      }

      /* CURTAIN LOADER TRANSITIONS */
      /* Fondo que sale y entra desde la sangre/borde (desaceleración continua, fluida y orgánica) */
      @keyframes curtain-bg-enter {
        0% {
          transform: translate3d(0, 100%, 0);
        }
        100% {
          transform: translate3d(0, 0%, 0);
        }
      }

      @keyframes curtain-bg-exit {
        0% {
          transform: translate3d(0, 0%, 0);
        }
        100% {
          transform: translate3d(0, -100%, 0);
        }
      }

      /* Movimiento del logo: Sube de abajo hacia arriba empezando desde medio camino (+140px) con desaceleración fluida idéntica */
      @keyframes loader-logo-rise {
        0% {
          transform: translate3d(0, 140px, 0);
          opacity: 0;
        }
        25% {
          opacity: 1;
        }
        100% {
          transform: translate3d(0, 0, 0);
          opacity: 1;
        }
      }

      /* Salida del logo: Sube hacia arriba suavemente y se desvanece */
      @keyframes loader-logo-fallout {
        0% {
          transform: translate3d(0, 0, 0);
          opacity: 1;
        }
        30% {
          opacity: 0.9;
        }
        100% {
          transform: translate3d(0, -130px, 0);
          opacity: 0;
        }
      }

      /* Rotación del logo al llegar al punto medio: siempre gira hacia la derecha (sentido horario), hace un paro en cada paso y repite */
      @keyframes loader-mid-rock {
        0.00% {
          transform: rotate(0deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        11.00% {
          transform: rotate(60deg);
        }
        16.67% {
          transform: rotate(60deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        27.67% {
          transform: rotate(120deg);
        }
        33.33% {
          transform: rotate(120deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        44.33% {
          transform: rotate(180deg);
        }
        50.00% {
          transform: rotate(180deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        61.00% {
          transform: rotate(240deg);
        }
        66.67% {
          transform: rotate(240deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        77.67% {
          transform: rotate(300deg);
        }
        83.33% {
          transform: rotate(300deg);
          animation-timing-function: cubic-bezier(0.35, 0, 0.25, 1);
        }
        94.33% {
          transform: rotate(360deg);
        }
        100.00% {
          transform: rotate(360deg);
        }
      }

      .animate-loader-mid-rock {
        animation: loader-mid-rock 3.9s linear infinite;
        transform-origin: center;
        will-change: transform;
      }

      /* Animación sutil de texto de año */
      @keyframes loader-stamp-fade {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      .curtain-bg-enter {
        animation: curtain-bg-enter 0.62s cubic-bezier(0.21, 0.88, 0.32, 1) forwards;
        will-change: transform;
      }

      .curtain-bg-hold {
        transform: translate3d(0, 0%, 0);
        will-change: transform;
      }

      .curtain-bg-exit {
        animation: curtain-bg-exit 0.44s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        will-change: transform;
      }

      .loader-logo-wrap-enter {
        animation: loader-logo-rise 0.6s cubic-bezier(0.21, 0.88, 0.32, 1) 0.02s both;
        will-change: transform, opacity;
      }

      .loader-logo-wrap-hold {
        transform: translate3d(0, 0, 0);
        opacity: 1;
        will-change: transform, opacity;
      }

      .loader-logo-wrap-exit {
        animation: loader-logo-fallout 0.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        will-change: transform, opacity;
      }

      .loader-stamp-enter {
        animation: loader-stamp-fade 0.4s ease-out forwards;
      }

      .loader-stamp-exit {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      @keyframes clock-tick {
        0% { transform: rotate(0deg); }
        1.25% { transform: rotate(4.4deg); }
        2.50% { transform: rotate(25.6deg); }
        3.75% { transform: rotate(30.0deg); }
        8.33% { transform: rotate(30.0deg); }
        9.58% { transform: rotate(34.4deg); }
        10.83% { transform: rotate(55.6deg); }
        12.08% { transform: rotate(60.0deg); }
        16.67% { transform: rotate(60.0deg); }
        17.92% { transform: rotate(64.4deg); }
        19.17% { transform: rotate(85.6deg); }
        20.42% { transform: rotate(90.0deg); }
        25.00% { transform: rotate(90.0deg); }
        26.25% { transform: rotate(94.4deg); }
        27.50% { transform: rotate(115.6deg); }
        28.75% { transform: rotate(120.0deg); }
        33.33% { transform: rotate(120.0deg); }
        34.58% { transform: rotate(124.4deg); }
        35.83% { transform: rotate(145.6deg); }
        37.08% { transform: rotate(150.0deg); }
        41.67% { transform: rotate(150.0deg); }
        42.92% { transform: rotate(154.4deg); }
        44.17% { transform: rotate(175.6deg); }
        45.42% { transform: rotate(180.0deg); }
        50.00% { transform: rotate(180.0deg); }
        51.25% { transform: rotate(184.4deg); }
        52.50% { transform: rotate(205.6deg); }
        53.75% { transform: rotate(210.0deg); }
        58.33% { transform: rotate(210.0deg); }
        59.58% { transform: rotate(214.4deg); }
        60.83% { transform: rotate(235.6deg); }
        62.08% { transform: rotate(240.0deg); }
        66.67% { transform: rotate(240.0deg); }
        67.92% { transform: rotate(244.4deg); }
        69.17% { transform: rotate(265.6deg); }
        70.42% { transform: rotate(270.0deg); }
        75.00% { transform: rotate(270.0deg); }
        76.25% { transform: rotate(274.4deg); }
        77.50% { transform: rotate(295.6deg); }
        78.75% { transform: rotate(300.0deg); }
        83.33% { transform: rotate(300.0deg); }
        84.58% { transform: rotate(304.4deg); }
        85.83% { transform: rotate(325.6deg); }
        87.08% { transform: rotate(330.0deg); }
        91.67% { transform: rotate(330.0deg); }
        92.92% { transform: rotate(334.4deg); }
        94.17% { transform: rotate(355.6deg); }
        95.42% { transform: rotate(360.0deg); }
        100.00% { transform: rotate(360.0deg); }
      }
      .animate-clock-tick {
        animation: clock-tick 12s linear infinite;
        transform-origin: center;
        display: inline-flex;
      }
      @keyframes glitch-slice-1 {
        0% { clip-path: inset(20% 0 60% 0); transform: translate(-4px, 1px); }
        20% { clip-path: inset(80% 0 5% 0); transform: translate(3px, -2px); }
        40% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
        60% { clip-path: inset(60% 0 25% 0); transform: translate(4px, -1px); }
        80% { clip-path: inset(30% 0 50% 0); transform: translate(-2px, -1px); }
        100% { clip-path: inset(50% 0 30% 0); transform: translate(0, 0); }
      }
      @keyframes glitch-slice-2 {
        0% { clip-path: inset(45% 0 35% 0); transform: translate(4px, -1px); }
        20% { clip-path: inset(15% 0 65% 0); transform: translate(-3px, 2px); }
        40% { clip-path: inset(75% 0 10% 0); transform: translate(2px, -2px); }
        60% { clip-path: inset(5% 0 85% 0); transform: translate(-4px, 1px); }
        80% { clip-path: inset(55% 0 20% 0); transform: translate(3px, 0); }
        100% { clip-path: inset(25% 0 55% 0); transform: translate(0, 0); }
      }
      @keyframes glitch-flicker {
        0%, 100% { opacity: 1; transform: translate(0, 0); }
        10% { opacity: 0.3; transform: translate(-3px, 1px); }
        25% { opacity: 0.9; transform: translate(2px, -2px) skewX(1deg); }
        40% { opacity: 0.1; transform: translate(-4px, 2px); }
        55% { opacity: 0.85; transform: translate(3px, -1px) skewX(-1.5deg); }
        70% { opacity: 0.2; transform: translate(-2px, -2px); }
        85% { opacity: 0.95; transform: translate(1px, 2px); }
      }
      .animate-glitch-flicker {
        animation: glitch-flicker 0.25s infinite;
      }
      .animate-glitch-1 {
        animation: glitch-slice-1 0.3s infinite ease-in-out alternate-reverse;
      }
      .animate-glitch-2 {
        animation: glitch-slice-2 0.25s infinite ease-in-out alternate-reverse;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Ajustamos el config de Tailwind para priorizar la fuente de Adobe
              sans: ["neue-haas-grotesk-display", "neue-haas-grotesk-text", 'Helvetica', 'Arial', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.1/",

        "react": "https://esm.sh/react@^19.2.1",
        "lucide-react": "https://esm.sh/lucide-react@^0.559.0"
      }
    }
    </script>
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

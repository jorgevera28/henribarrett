<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henri Barrett® | Brand Architecture</title>
    
    <!-- ADOBE FONTS (TYPEKIT) -->
    <link rel="stylesheet" href="https://use.typekit.net/hdy5eik.css">
    
    <style>
      body {
        /* Se asume que el kit de Adobe proporciona la familia 'neue-haas-grotesk-display' o similar. 
           Usamos un stack de fuentes compatible. */
        font-family: "neue-haas-grotesk-display", "neue-haas-grotesk-text", 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        -webkit-font-smoothing: antialiased;
        color: #000000;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      h1, h2, h3 {
        letter-spacing: -0.04em;
        line-height: 0.95;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @keyframes marquee-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      @keyframes marquee-right {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0); }
      }
      @keyframes marquee-up {
        0% { transform: translateY(0); }
        100% { transform: translateY(-50%); }
      }
      @keyframes marquee-down {
        0% { transform: translateY(-50%); }
        100% { transform: translateY(0); }
      }
      .animate-marquee-left {
        animation: marquee-left 30s linear infinite;
      }
      .animate-marquee-right {
        animation: marquee-right 30s linear infinite;
      }
      .animate-marquee-up {
        animation: marquee-up 32s linear infinite;
      }
      .animate-marquee-down {
        animation: marquee-down 32s linear infinite;
      }
      .animate-marquee-up-alt {
        animation: marquee-up 38s linear infinite;
      }
      .animate-marquee-down-alt {
        animation: marquee-down 36s linear infinite;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Ajustamos el config de Tailwind para priorizar la fuente de Adobe
              sans: ["neue-haas-grotesk-display", "neue-haas-grotesk-text", 'Helvetica', 'Arial', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.1/",
        "react/": "https://esm.sh/react@^19.2.1/",
        "react": "https://esm.sh/react@^19.2.1",
        "lucide-react": "https://esm.sh/lucide-react@^0.559.0"
      }
    }
    </script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
